<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linaje & Genealogía Familiar</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <span class="brand-icon">🌳</span>
            <h1>Archivo Genealógico Familiar</h1>
        </div>
        
        <nav class="nav-tabs">
            <button id="tab-arbol" class="tab-btn active" onclick="cambiarPestana('arbol')">Vista del Árbol</button>
            <button id="tab-admin" class="tab-btn" onclick="cambiarPestana('admin')">Administrar / Agregar</button>
        </nav>

        <div class="acciones-header">
            <button id="btn-exportar" class="btn-exportar" onclick="exportarJSON()">⬇ Exportar JSON</button>
        </div>
    </header>

    <!-- PESTAÑA 1: VISUALIZADOR DEL ÁRBOL -->
    <section id="vista-arbol" class="vista-activa">
        <div class="barra-filtros">
            <input type="text" id="buscador" placeholder="Buscar por nombre, apellido o nacionalidad..." onkeyup="filtrarTarjetas()">
            <select id="filtro-generacion" onchange="filtrarTarjetas()">
                <option value="todas">Todas las Generaciones</option>
                <option value="Gen 1">Generación 1</option>
                <option value="Gen 2">Generación 2</option>
                <option value="Gen 3">Generación 3</option>
                <option value="Gen 4">Generación 4</option>
            </select>
        </div>

        <main id="canvas-arbol">
            <div id="arbol-net">
                <!-- Las tarjetas familiares se dibujan aquí -->
            </div>
        </main>

        <footer class="app-footer">
            <span class="leyenda-item"><span class="punto masculino"></span> Hombre (Neutro)</span>
            <span class="leyenda-item"><span class="punto femenino"></span> Mujer (Color de Rama)</span>
            <span class="leyenda-item"><span class="punto doble"></span> Mujer (50% / 50% Doble Rama)</span>
            <span class="instruccion">Borrador interactivo • Edita cualquier tarjeta desde la pestaña Administrar</span>
        </footer>
    </section>

    <!-- PESTAÑA 2: PANEL ADMINISTRADOR -->
    <section id="vista-admin" class="vista-oculta">
        <div class="admin-container">
            <div class="admin-form-card">
                <h2 id="titulo-formulario">Registrar / Editar Familiar</h2>
                <form id="form-familiar" onsubmit="guardarFamiliar(event)">
                    <input type="hidden" id="edit-id">
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" id="inp-nombre" required placeholder="Ej. Kenneth">
                        </div>
                        <div class="form-group">
                            <label>Apellidos</label>
                            <input type="text" id="inp-apellido" placeholder="Ej. John">
                        </div>
                        <div class="form-group">
                            <label>Generación *</label>
                            <select id="inp-generacion">
                                <option value="Gen 1">Gen 1</option>
                                <option value="Gen 2">Gen 2</option>
                                <option value="Gen 3">Gen 3</option>
                                <option value="Gen 4">Gen 4</option>
                                <option value="Gen 5">Gen 5</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Sexo *</label>
                            <select id="inp-sexo" onchange="toggleColoresRama()">
                                <option value="M">Masculino (M)</option>
                                <option value="F">Femenino (F)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Año de Nacimiento (aprox.) *</label>
                            <input type="number" id="inp-anio" required placeholder="Ej. 1945" min="1800" max="2026">
                        </div>
                        <div class="form-group">
                            <label>Nacionalidad</label>
                            <input type="text" id="inp-nacionalidad" placeholder="Ej. Brasileño, Argentino, Alemán">
                        </div>
                    </div>

                    <!-- Opciones de color (solo activas para mujeres) -->
                    <div id="bloque-colores" class="bloque-colores oculto">
                        <h4>Color de Rama Materna</h4>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Tipo de Color</label>
                                <select id="inp-tipo-color" onchange="toggleDobleColor()">
                                    <option value="unico">Color Único</option>
                                    <option value="50-50">División 50% / 50% (Dos Ramas)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Color Principal</label>
                                <select id="inp-color-1">
                                    <option value="rojo">Rojo</option>
                                    <option value="azul">Azul</option>
                                    <option value="amarillo">Amarillo</option>
                                    <option value="verde">Verde</option>
                                    <option value="morado">Morado</option>
                                </select>
                            </div>
                            <div class="form-group oculto" id="grupo-color-2">
                                <label>Segundo Color (50%)</label>
                                <select id="inp-color-2">
                                    <option value="azul">Azul</option>
                                    <option value="rojo">Rojo</option>
                                    <option value="amarillo">Amarillo</option>
                                    <option value="verde">Verde</option>
                                    <option value="morado">Morado</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Pareja(s) (separadas por coma)</label>
                        <input type="text" id="inp-parejas" placeholder="Ej. Janet Hick, Kelly Brow, Lori Scot">
                    </div>

                    <div class="form-group">
                        <label>Hijos / Descendientes directos (separados por coma)</label>
                        <input type="text" id="inp-hijos" placeholder="Ej. Janice John Hick, Sara John Brow">
                    </div>

                    <div class="form-botones">
                        <button type="submit" class="btn-guardar">Guardar Familiar</button>
                        <button type="button" class="btn-limpiar" onclick="limpiarFormulario()">Limpiar</button>
                    </div>
                </form>
            </div>

            <div class="admin-list-card">
                <h3>Registros Actuales (<span id="contador-registros">0</span>)</h3>
                <div id="lista-admin-registros">
                    <!-- Lista rápida para editar o eliminar registros -->
                </div>
            </div>
        </div>
    </section>

    <script src="js/arbol.js"></script>
</body>
</html>
